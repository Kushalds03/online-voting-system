apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voting-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: voting.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: voting-frontend-service
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: voting-backend-service
            port:
              number: 5000